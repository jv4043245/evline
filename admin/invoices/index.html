<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow"><meta name="referrer" content="same-origin">
  <title>Рахунки клієнтам | EVLine CRM</title>
  <link rel="icon" href="/assets/images/favicon.png">
  <link rel="stylesheet" href="/admin/documents/documents.css?v=20261027-invoices">
  <link rel="stylesheet" href="/admin/invoices/invoices.css?v=20261027-numbering">
  <script type="module" src="/admin/invoices/invoices.js?v=20261027-numbering"></script>
</head>
<body>
  <header class="app-header"><a class="brand" href="/admin/"><img src="/assets/images/logo.png" width="98" height="40" alt="EVLine"><span>CRM</span></a><a href="/admin/">До замовлень</a></header>
  <main class="invoice-register">
    <div class="register-heading"><h1>Рахунки клієнтам</h1><a class="button primary" href="/admin/documents/" data-new>Створити рахунок</a></div>
    <section class="register-numbering" aria-label="Нумерація рахунків">
      <div class="numbering-summary"><span data-numbering-summary aria-live="polite">Нумерація рахунків</span><button type="button" class="icon-button" data-numbering-toggle aria-label="Змінити нумерацію" title="Змінити нумерацію" aria-expanded="false" aria-controls="numbering-form"></button></div>
      <form id="numbering-form" data-numbering-form hidden>
        <div class="numbering-fields"><label>Наступний номер<input name="next_number" type="number" min="10" max="999999999" step="1" inputmode="numeric" required></label><button type="submit" data-numbering-save>Застосувати</button><button type="button" data-numbering-cancel>Скасувати</button></div>
        <p class="numbering-note">Пропущені номери не використовуватимуться. Виставлені рахунки не зміняться.</p>
        <p class="numbering-history" data-numbering-history hidden></p>
      </form>
      <p class="notice error" role="alert" data-numbering-error hidden></p>
      <p class="numbering-result" role="status" data-numbering-result hidden></p>
    </section>
    <form data-filters class="register-filters">
      <label>Пошук<input name="q" type="search" placeholder="Номер, клієнт, телефон" maxlength="100" autocomplete="off"></label>
      <label>Стан<select name="status"><option value="">Усі рахунки</option value="ready">Виставлені</option><option value="draft">Чернетки</option></select></label>
      <button type="submit">Знайти</button><button type="button" class="icon-button" data-reload title="Оновити список" aria-label="Оновити список"></button>
    </form>
    <p data-error class="notice error" role="alert" hidden></p>
    <p data-auth class="notice" hidden>Потрібен <a href="/admin/">вхід до адмінки</a>.</p>
    <div data-results aria-live="polite">Завантаження…</div>
    <nav class="register-pagination" aria-label="Сторінки рахунків"><button type="button" data-prev>Назад</button><span data-page></span><button type="button" data-next>Далі</button></nav>
  </main>
  <dialog data-numbering-confirm aria-labelledby="numbering-confirm-title">
    <div class="dialog-heading"><h2 id="numbering-confirm-title">Змінити нумерацію?</h2></div>
    <p data-numbering-confirm-text></p>
    <div class="dialog-actions"><button type="button" data-numbering-dismiss>Скасувати</button><button type="button" class="primary" data-numbering-accept>Підтвердити</button></div>
  </dialog>
</body>
</html>
